<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techno · Technoference S01 Komuta Merkezi</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar::-webkit-scrollbar-track { background: #f5f5f5; }
  .scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  .task-row:hover { background: rgba(124, 58, 237, 0.08); }
  .urgent-pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .phase-active { background: linear-gradient(135deg, rgb(124 58 237 / 0.2), rgb(34 211 238 / 0.1)); border-color: rgb(124 58 237 / 0.5); }
</style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen"><header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-zinc-200">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight"><span class="text-violet-400">Techno</span><span class="text-zinc-400 text-base font-normal"> · Technoference S01</span></h1>
      <p class="text-sm text-zinc-400 mt-0.5">15 Haziran 2026 · Komünite @ Terminal Kadıköy</p>
    </div>
    <div class="flex items-center gap-5 text-sm flex-wrap">
      <div><span class="text-zinc-400">Açık:</span> <span id="stat-open" class="font-bold">…</span></div>
      <div><span class="text-zinc-400">Acil:</span> <span id="stat-urgent" class="font-bold text-red-400">…</span></div>
      <div><span class="text-zinc-400">Bugün ✅:</span> <span id="stat-today" class="font-bold text-green-400">…</span></div>
      <div class="text-violet-400 font-bold text-lg">⏳ <span id="stat-days">…</span> gün</div>
      <div class="flex gap-1">
        <button id="dl-tasks" class="text-xs bg-zinc-100 hover:bg-zinc-200 px-2 py-1 rounded">⬇ Görevler</button>
        <button id="dl-crm" class="text-xs bg-zinc-100 hover:bg-zinc-200 px-2 py-1 rounded">⬇ CRM</button>
        <button id="dl-invites" class="text-xs bg-zinc-100 hover:bg-zinc-200 px-2 py-1 rounded">⬇ Davet</button>
      </div>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-6 pb-3 flex gap-2 flex-wrap">
    <button data-phase="oncesi" class="phase-btn phase-active px-5 py-2.5 rounded-xl border border-zinc-300 flex items-center gap-2"><span class="text-lg">🕐</span><div class="text-left"><div class="text-xs text-zinc-400">HAZIRLIK</div><div class="font-bold">Öncesi <span class="phase-count text-violet-300">0</span></div></div></button>
    <button data-phase="sirasi" class="phase-btn px-5 py-2.5 rounded-xl border border-zinc-200 hover:border-zinc-300 flex items-center gap-2"><span class="text-lg">🎬</span><div class="text-left"><div class="text-xs text-zinc-400">15 HAZİRAN</div><div class="font-bold">Sırası <span class="phase-count text-zinc-400">0</span></div></div></button>
    <button data-phase="sonrasi" class="phase-btn px-5 py-2.5 rounded-xl border border-zinc-200 hover:border-zinc-300 flex items-center gap-2"><span class="text-lg">📮</span><div class="text-left"><div class="text-xs text-zinc-400">POST-EVENT</div><div class="font-bold">Sonrası <span class="phase-count text-zinc-400">0</span></div></div></button>
    <div class="flex-1"></div>
    <button data-phase="davet" class="phase-btn px-5 py-2.5 rounded-xl border border-zinc-200 hover:border-zinc-300 flex items-center gap-2"><span class="text-lg">📨</span><div class="text-left"><div class="text-xs text-zinc-400">RSVP PANO</div><div class="font-bold">Davet <span class="phase-count text-zinc-400">0</span></div></div></button>
    <button data-phase="crm" class="phase-btn px-5 py-2.5 rounded-xl border border-zinc-200 hover:border-zinc-300 flex items-center gap-2"><span class="text-lg">📇</span><div class="text-left"><div class="text-xs text-zinc-400">KONTAKLAR</div><div class="font-bold">CRM <span class="phase-count text-zinc-400">0</span></div></div></button>
    <button data-phase="done" class="phase-btn px-5 py-2.5 rounded-xl border border-zinc-200 hover:border-zinc-300 flex items-center gap-2"><span class="text-lg">✅</span><div class="text-left"><div class="text-xs text-zinc-400">ARŞİV</div><div class="font-bold">Bitti <span class="phase-count text-zinc-400">0</span></div></div></button>
  </div>
</header><div class="max-w-7xl mx-auto px-6 mt-6" id="quickadd-row">
  <div class="bg-white rounded-xl border border-zinc-200 p-4 flex gap-3 flex-wrap">
    <input id="quickadd" placeholder="Hızlı görev ekle… ('!' acil için, '#kategori' için)" class="flex-1 min-w-[200px] bg-zinc-50 border border-zinc-200 rounded-lg px-4 py-2.5 placeholder-zinc-400 focus:outline-none focus:border-violet-500" />
    <select id="qa-category" class="bg-white border border-zinc-200 rounded-lg px-3"><option value="acil">🔴 acil</option><option value="sponsorluk">💰 sponsorluk</option><option value="davetli">📧 davetli</option><option value="basin">📰 basın</option><option value="sosyal_medya">📱 sosyal medya</option><option value="panelist">🎤 panelist</option><option value="ortak">🤝 ortak</option><option value="kit_icerik">📦 kit içerik</option><option value="mektup">✍ mektup</option><option value="uretim">🏭 üretim</option><option value="tasarim">🎨 tasarım</option><option value="ekip">👥 ekip</option><option value="etkinlik_gunu">🎬 gün</option><option value="sonrasi">📮 sonrası</option></select>
    <label class="flex items-center gap-2 text-sm text-zinc-400 px-3"><input type="checkbox" id="qa-urgent" class="accent-red-500" />Acil</label>
    <button id="qa-add" class="bg-violet-600 hover:bg-violet-500 px-5 py-2 rounded-lg font-medium">Ekle</button>
  </div>
</div><div class="max-w-7xl mx-auto px-6 mt-4" id="catfilter-row"><div class="flex gap-1 overflow-x-auto pb-2 scrollbar text-sm" id="catfilter"></div></div><div class="max-w-7xl mx-auto px-6 mt-2">
  <div class="flex items-center gap-3"><input id="search" placeholder="🔎 Ara — kişi, şirket, görev metni" class="flex-1 bg-white border border-zinc-200 rounded-lg px-3 py-1.5 text-sm" /><button id="refresh-btn" class="text-sm bg-white hover:bg-zinc-100 border border-zinc-200 px-3 py-1.5 rounded-lg">↻ Yenile</button><span id="last-update" class="text-xs text-zinc-400"></span></div>
</div><main class="max-w-7xl mx-auto px-6 pb-20 mt-4">
  <div id="task-list" class="space-y-2"></div>
  <div id="invite-list" class="hidden"></div>
  <div id="crm-list" class="hidden space-y-2"></div>
  <div id="empty-state" class="hidden text-center py-16 text-zinc-400">Bu kategoride kayıt yok.</div>
</main><footer class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-zinc-200 py-2 text-center text-xs text-zinc-400">🎩 Techno · Telegram @HatlyPlannerBot · Supabase Edge Function</footer><script>
const SUPABASE_URL="https://aopxqpborhfaegsrache.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvcHhxcGJvcmhmYWVnc3JhY2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMDU3NzUsImV4cCI6MjA4NzU4MTc3NX0.MWlFRKxIOsFdZHfcXp0lc8YcroZvqhzQcvIKv2sGf6o";
const EVENT_DATE=new Date("2026-06-15T00:00:00Z");
const PHASE_CATS={oncesi:["acil","sponsorluk","davetli","basin","sosyal_medya","panelist","ortak","kit_icerik","mektup","uretim","tasarim","ekip"],sirasi:["etkinlik_gunu"],sonrasi:["sonrasi"]};
const META={acil:{e:"🔴",l:"Acil",c:"text-red-600"},sponsorluk:{e:"💰",l:"Sponsorluk",c:"text-amber-600"},davetli:{e:"📧",l:"Davetli",c:"text-blue-600"},basin:{e:"📰",l:"Basın",c:"text-cyan-600"},sosyal_medya:{e:"📱",l:"Sosyal Medya",c:"text-sky-600"},panelist:{e:"🎤",l:"Panelist",c:"text-violet-600"},ortak:{e:"🤝",l:"Ortak",c:"text-pink-600"},kit_icerik:{e:"📦",l:"Kit İçerik",c:"text-orange-600"},mektup:{e:"✍",l:"Mektup",c:"text-rose-600"},uretim:{e:"🏭",l:"Üretim",c:"text-stone-600"},tasarim:{e:"🎨",l:"Tasarım",c:"text-fuchsia-600"},ekip:{e:"👥",l:"Ekip",c:"text-teal-600"},etkinlik_gunu:{e:"🎬",l:"Gün",c:"text-emerald-600"},sonrasi:{e:"📮",l:"Sonrası",c:"text-lime-600"}};
const STATUSES=[{v:"gonderildi",l:"📤 Gönderildi"},{v:"bekleniyor",l:"⏳ Bekleniyor"},{v:"onayladi",l:"✅ Onayladı"},{v:"red",l:"❌ Red"},{v:"takip",l:"🔄 Takip"},{v:"iptal",l:"🚫 İptal"}];
let S={tasks:[],crm:[],invites:[],phase:"oncesi",cat:"all",q:""};
async function api(p,i={}){const r=await fetch(SUPABASE_URL+"/rest/v1"+p,{...i,headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY,"Content-Type":"application/json",Prefer:(i.method==="PATCH"||i.method==="POST")?"return=representation":"",...(i.headers||{})}});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
function clean(s){return (s||"").replace(/\*\*/g,"").replace(/\*/g,"")}
function badge(t){const m=META[t.category]||{e:"📌",l:t.category,c:"text-zinc-400"};return '<span class="text-xs px-2 py-0.5 rounded bg-zinc-100 '+m.c+'">'+m.e+' '+m.l+'</span>'}
async function loadAll(){document.getElementById("last-update").textContent="yükleniyor…";const[t,c,iv]=await Promise.all([api("/techno_tasks?order=priority.desc,created_at.desc&limit=500"),api("/techno_crm?order=created_at.desc&limit=500"),api("/techno_invites?order=created_at.desc&limit=200")]);S.tasks=t;S.crm=c;S.invites=iv;render();document.getElementById("last-update").textContent="Son: "+new Date().toLocaleTimeString("tr-TR")}
function stats(){const o=S.tasks.filter(t=>t.status==="open").length;const u=S.tasks.filter(t=>t.status==="open"&&t.priority==="urgent").length;const today=new Date().toISOString().slice(0,10);const d=S.tasks.filter(t=>t.status==="done"&&t.closed_at?.startsWith(today)).length;const days=Math.ceil((EVENT_DATE.getTime()-Date.now())/86400000);document.getElementById("stat-open").textContent=o;document.getElementById("stat-urgent").textContent=u;document.getElementById("stat-today").textContent=d;document.getElementById("stat-days").textContent=days}
function phaseCounts(){document.querySelectorAll(".phase-btn").forEach(b=>{const ph=b.dataset.phase;let c=0;if(ph==="oncesi")c=S.tasks.filter(t=>t.status==="open"&&PHASE_CATS.oncesi.includes(t.category)).length;else if(ph==="sirasi")c=S.tasks.filter(t=>t.status==="open"&&PHASE_CATS.sirasi.includes(t.category)).length;else if(ph==="sonrasi")c=S.tasks.filter(t=>t.status==="open"&&PHASE_CATS.sonrasi.includes(t.category)).length;else if(ph==="davet")c=S.invites.length;else if(ph==="crm")c=S.crm.length;else if(ph==="done")c=S.tasks.filter(t=>t.status==="done").length;const s=b.querySelector(".phase-count");if(s)s.textContent=c})}
function renderCatFilter(){const row=document.getElementById("catfilter-row");if(!["oncesi","sirasi","sonrasi"].includes(S.phase)){row.style.display="none";return}row.style.display="block";const cats=PHASE_CATS[S.phase];const ac=S.tasks.filter(t=>t.status==="open"&&cats.includes(t.category)).length;let h='<button data-cat="all" class="catf px-3 py-1 rounded-lg text-sm whitespace-nowrap '+(S.cat==="all"?"bg-violet-600/20 text-violet-300 border border-violet-600/30":"hover:bg-zinc-100 text-zinc-400")+'">Tümü <span class="opacity-60">'+ac+'</span></button>';cats.forEach(c=>{const cnt=S.tasks.filter(t=>t.status==="open"&&t.category===c).length;const m=META[c];h+='<button data-cat="'+c+'" class="catf px-3 py-1 rounded-lg text-sm whitespace-nowrap '+(S.cat===c?"bg-violet-600/20 text-violet-300 border border-violet-600/30":"hover:bg-zinc-100 text-zinc-400")+'">'+m.e+" "+m.l+' <span class="opacity-60">'+cnt+'</span></button>'});document.getElementById("catfilter").innerHTML=h}
function filt(){let l=S.tasks;if(S.phase==="done")l=l.filter(t=>t.status==="done");else{const cats=PHASE_CATS[S.phase];l=l.filter(t=>t.status==="open"&&cats.includes(t.category));if(S.cat!=="all")l=l.filter(t=>t.category===S.cat)}if(S.q){const q=S.q.toLowerCase();l=l.filter(t=>(t.text||"").toLowerCase().includes(q)||(t.related_person||"").toLowerCase().includes(q))}return l}
function rowTask(t){const txt=esc(clean(t.text));const b=badge(t);const dot=(t.priority==="urgent"&&t.status==="open")?'<span class="w-2 h-2 rounded-full bg-red-500 urgent-pulse flex-shrink-0"></span>':'<span class="w-2 h-2 rounded-full bg-zinc-700 flex-shrink-0"></span>';const cb=t.status==="done"?'<button class="task-check w-5 h-5 rounded border-2 border-green-500 bg-green-500 text-zinc-900 flex items-center justify-center text-xs flex-shrink-0">✓</button>':'<button class="task-check w-5 h-5 rounded border-2 border-zinc-600 hover:border-violet-500 flex-shrink-0"></button>';return '<div class="task-row group flex items-start gap-3 px-4 py-3 bg-white rounded-lg border border-zinc-200" data-id="'+t.id+'">'+dot+cb+'<div class="flex-1 min-w-0"><div class="text-sm '+(t.status==="done"?"line-through text-zinc-400":"text-zinc-800")+'">'+txt+'</div><div class="flex items-center gap-2 mt-1">'+b+'</div></div><div class="opacity-0 group-hover:opacity-100 flex gap-1"><button class="task-urgent text-zinc-400 hover:text-red-400 px-2 text-sm" title="Acile al">🔥</button><button class="task-delete text-zinc-400 hover:text-red-400 px-2 text-sm" title="Sil">🗑</button></div></div>'}
function rowInvite(i){let so="";STATUSES.forEach(s=>{so+='<option value="'+s.v+'"'+(i.status===s.v?" selected":"")+'>'+s.l+'</option>'});const sent=i.sent_date?'<div class="text-xs text-zinc-400">📅 '+esc(i.sent_date)+'</div>':"";return '<div class="task-row flex items-start gap-3 px-4 py-3 bg-white rounded-lg border border-zinc-200" data-id="'+i.id+'"><div class="flex-1 min-w-0"><div class="font-medium text-zinc-800">'+esc(i.name)+(i.company?' <span class="text-zinc-400 font-normal text-sm">· '+esc(i.company)+'</span>':"")+'</div><div class="text-xs text-zinc-400 mt-1">'+(i.channel?esc(i.channel):"-")+(i.contact_info?" · "+esc(i.contact_info):"")+'</div>'+sent+(i.notes?'<div class="text-xs text-zinc-400 mt-1">'+esc(i.notes)+'</div>':"")+'</div><select class="invite-status bg-zinc-50 border border-zinc-200 rounded px-2 py-1 text-xs">'+so+'</select><button class="invite-delete text-zinc-400 hover:text-red-400 px-2 text-sm">🗑</button></div>'}
function rowCRM(c){return '<div class="task-row flex items-start gap-3 px-4 py-3 bg-white rounded-lg border border-zinc-200"><div class="flex-1 min-w-0"><div class="font-medium text-zinc-800">'+esc(c.name)+'</div><div class="text-xs text-zinc-400 mt-1">'+(c.company?'<span class="text-zinc-400">'+esc(c.company)+'</span> · ':"")+(c.category?'<span class="text-violet-300">'+esc(c.category)+'</span>':"")+(c.status?" · "+esc(c.status):"")+'</div>'+(c.contact_info?'<div class="text-xs text-zinc-400 mt-0.5">'+esc(c.contact_info)+'</div>':"")+(c.notes?'<div class="text-xs text-zinc-400 mt-0.5">'+esc(c.notes)+'</div>':"")+'</div></div>'}
function render(){stats();phaseCounts();renderCatFilter();const tl=document.getElementById("task-list");const il=document.getElementById("invite-list");const cl=document.getElementById("crm-list");const em=document.getElementById("empty-state");const qr=document.getElementById("quickadd-row");tl.classList.add("hidden");il.classList.add("hidden");cl.classList.add("hidden");if(S.phase==="davet"){let l=S.invites;if(S.q){const q=S.q.toLowerCase();l=l.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.company||"").toLowerCase().includes(q))}il.classList.remove("hidden");il.innerHTML='<div class="grid grid-cols-2 sm:grid-cols-6 gap-2 mb-4">'+STATUSES.map(s=>{const c=S.invites.filter(i=>i.status===s.v).length;return '<div class="bg-white border border-zinc-200 rounded-lg p-2 text-center"><div class="text-xs text-zinc-400">'+s.l+'</div><div class="text-lg font-bold">'+c+'</div></div>'}).join("")+'</div><div class="space-y-2">'+l.map(rowInvite).join("")+'</div>';em.classList.toggle("hidden",l.length>0);qr.style.display="none"}else if(S.phase==="crm"){let l=S.crm;if(S.q){const q=S.q.toLowerCase();l=l.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.company||"").toLowerCase().includes(q)||(x.contact_info||"").toLowerCase().includes(q))}cl.classList.remove("hidden");cl.innerHTML=l.slice(0,300).map(rowCRM).join("");em.classList.toggle("hidden",l.length>0);qr.style.display="none"}else{tl.classList.remove("hidden");const l=filt();tl.innerHTML=l.map(rowTask).join("");em.classList.toggle("hidden",l.length>0);qr.style.display="block"}}
async function toggle(id){const t=S.tasks.find(x=>x.id==id);if(!t)return;const ns=t.status==="done"?"open":"done";const p={status:ns,updated_at:new Date().toISOString()};p.closed_at=ns==="done"?new Date().toISOString():null;await api("/techno_tasks?id=eq."+id,{method:"PATCH",body:JSON.stringify(p)});await loadAll()}
async function setUrgent(id){const t=S.tasks.find(x=>x.id==id);if(!t)return;const np=t.priority==="urgent"?"normal":"urgent";await api("/techno_tasks?id=eq."+id,{method:"PATCH",body:JSON.stringify({priority:np,updated_at:new Date().toISOString()})});await loadAll()}
async function del(id,table){if(!confirm("Silmek istediğinden emin misin?"))return;await api("/"+table+"?id=eq."+id,{method:"DELETE"});await loadAll()}
async function updateInviteStatus(id,status){await api("/techno_invites?id=eq."+id,{method:"PATCH",body:JSON.stringify({status,updated_at:new Date().toISOString()})});await loadAll()}
async function addQ(){const text=document.getElementById("quickadd").value.trim();if(!text)return;let cat=document.getElementById("qa-category").value;const urgent=document.getElementById("qa-urgent").checked;let ct=text;const hm=text.match(/#(\w+)/);if(hm&&META[hm[1]]){cat=hm[1];ct=text.replace(/#\w+/g,"").trim()}const u=urgent||/!\s*$/.test(text);ct=ct.replace(/!\s*$/,"").trim();await api("/techno_tasks",{method:"POST",body:JSON.stringify({text:ct,category:cat,status:"open",priority:u?"urgent":"normal"})});document.getElementById("quickadd").value="";document.getElementById("qa-urgent").checked=false;await loadAll()}
function csvDownload(filename,headers,rows){const csv=[headers.join(",")].concat(rows.map(r=>headers.map(h=>{const v=r[h];return '"'+String(v??"").replace(/"/g,'""')+'"'}).join(","))).join("\\n");const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click()}
document.addEventListener("click",e=>{const ph=e.target.closest(".phase-btn");if(ph){S.phase=ph.dataset.phase;S.cat="all";document.querySelectorAll(".phase-btn").forEach(b=>{b.classList.remove("phase-active","border-zinc-300");b.classList.add("border-zinc-200")});ph.classList.add("phase-active","border-zinc-300");ph.classList.remove("border-zinc-200");render();return}const cf=e.target.closest(".catf");if(cf){S.cat=cf.dataset.cat;render();return}const ch=e.target.closest(".task-check");if(ch){toggle(ch.closest(".task-row").dataset.id);return}const ur=e.target.closest(".task-urgent");if(ur){setUrgent(ur.closest(".task-row").dataset.id);return}const td=e.target.closest(".task-delete");if(td){del(td.closest(".task-row").dataset.id,"techno_tasks");return}const id_=e.target.closest(".invite-delete");if(id_){del(id_.closest(".task-row").dataset.id,"techno_invites");return}});
document.addEventListener("change",e=>{const sel=e.target.closest(".invite-status");if(sel)updateInviteStatus(sel.closest(".task-row").dataset.id,sel.value)});
document.getElementById("qa-add").addEventListener("click",addQ);
document.getElementById("quickadd").addEventListener("keydown",e=>{if(e.key==="Enter")addQ()});
document.getElementById("search").addEventListener("input",e=>{S.q=e.target.value;render()});
document.getElementById("refresh-btn").addEventListener("click",loadAll);
const today=()=>new Date().toISOString().slice(0,10);
document.getElementById("dl-tasks").addEventListener("click",()=>csvDownload("technoference_tasks_"+today()+".csv",["id","text","category","status","priority","related_person","notes","created_at","closed_at"],S.tasks));
document.getElementById("dl-crm").addEventListener("click",()=>csvDownload("technoference_crm_"+today()+".csv",["id","name","company","category","status","contact_info","notes","source"],S.crm));
document.getElementById("dl-invites").addEventListener("click",()=>csvDownload("technoference_davet_"+today()+".csv",["id","name","company","channel","sent_date","status","contact_info","notes"],S.invites));
loadAll();setInterval(loadAll,30000);
</script>
</body>
</html>
